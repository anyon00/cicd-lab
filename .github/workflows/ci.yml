name: CI

# 언제 깨어날까? → main에 push될 때, 그리고 PR이 올라올 때
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest           # 임시 주방: 리눅스 컴퓨터 한 대 빌리기
    steps:
      - uses: actions/checkout@v4    # 레시피 노트(코드) 가져오기
      - uses: astral-sh/setup-uv@v5  # 도구(uv) 준비
      - run: uv sync --locked        # 재료(의존성) 준비
      - run: uv run ruff check .     # 맞춤법 검사
      - run: uv run ruff format --check .
      - run: uv run pytest -v        # 채점